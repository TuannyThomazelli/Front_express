
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Consulta de Data e Hora</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <div class="card">

            <div class="icon">🕐</div>

            <h1>Consulta de Data e Hora</h1>

            <p class="subtitle">
                Consulte a data e hora atual através da nossa API.
            </p>

            <div class="datetime">

                <div class="info">
                    <span class="label">DATA E HORA</span>
                    <span id="date">--/--/---- --:--:--</span>
                </div>

            </div>

            <div class="status">
                <span id="status">Conectando à API...</span>
            </div>

            <button id="atualizar">
                🔄 Atualizar
            </button>

        </div>

    </main>

    <script src="script.js"></script>

</body>

</html>
